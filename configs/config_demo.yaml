global:
  input_type: visium_hd
  directory: 'your_root_folder'
  pseudo_radius: 55
  superpixel_size: 16
  seed: 42

histology:
  token_env: HF_TOKEN
  model_name: "UNI"

train:
  epochs: 400
  device: "cuda"
  gpu_ids: [0]
  n_states: 1
  BCAF_embeddings: 256
  k_neighbors: 6
  learning_rate: 0.0001
  batch_size: auto
  load_saved: false
  enhance: true

preprocessing:
  visium_hd:
    sample_size: 'square_008um'
    raw_image_name: 'Visium_HD_Mouse_Brain_tissue_image.tif'
    output_image_name: 'he.jpg'
    gene_names_name: 'gene-names.txt'
    ground_truth: 'genes_3D.pkl'
    scale_pix_size: 0.5
    num_top_genes: 1000

export:
  enabled: true
  h5ad_name: deephex_expression.h5ad
  csv: false
  csv_name: deephex_expression.csv
  metadata_name: run_metadata.json
